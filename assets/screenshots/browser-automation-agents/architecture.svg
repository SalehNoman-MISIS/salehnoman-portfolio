 fill="#5E6B7A" text-anchor="middle" dominant-baseline="middle">register·login·search·post·…</text><line x1="400" y1="292" x2="300" y2="358" stroke="#2E73B8" stroke-width="2.5"  marker-end="url(#ah)"/><line x1="640" y1="292" x2="700" y2="358" stroke="#2E73B8" stroke-width="2.5"  marker-end="url(#ah)"/><rect x="300" y="520" width="440" height="74" rx="14" fill="#123E73" stroke="#123E73" stroke-width="1.5"/><text x="520" y="550" font-family="'Inter','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">Playwright — stealth Chromium</text><text x="520" y="570" font-family="'Inter','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif" font-size="12" font-weight="500" fill="#B9CEE8" text-anchor="middle" dominant-baseline="middle">in-memory sessions · 2h TTL</text><line x1="295" y1="456" x2="430" y2="520" stroke="#2E73B8" stroke-width="2.5"  marker-end="url(#ah)"/><line x1="745" y1="456" x2="610" y2="520" stroke="#2E73B8" stroke-width="2.5"  marker-end="url(#ah)"/><rect x="760" y="214" width="210" height="78" rx="14" fill="#FFFFFF" stroke="#CBE0F5" stroke-width="1.5"/><text x="865" y="246" font-family="'Inter','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif" font-size="16" font-weight="700" fill="#123E73" text-anchor="middle" dominant-baseline="middle">n8n Cloud</text><text x="865" y="266" font-family="'Inter','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif" font-size="12" font-weight="500" fill="#5E6B7A" text-anchor="middle" dominant-baseline="middle">via ngrok tunnel</text><line x1="755" y1="253" x2="745" y2="253" stroke="#2E73B8" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#ah)"/>
