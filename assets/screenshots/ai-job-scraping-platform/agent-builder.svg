<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 650" width="1040" height="650" role="img" aria-label="Agentic source builder">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2E73B8"/>
    </marker>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5B9BD5"/><stop offset="1" stop-color="#9AC6EC"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F3F9FF"/>
    </linearGradient>
  </defs>
  <rect width="1040" height="650" rx="20" fill="url(#bg)"/>
  <rect x="1" y="1" width="1038" height="648" rx="19" fill="none" stroke="#CBE0F5" stroke-width="2"/>
  <rect x="34" y="40" width="6" height="30" rx="3" fill="#2E73B8"/>
  <text x="52" y="56" font-family="'Inter','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif" font-size="24" font-weight="800" fill="#123E73">Agentic source builder</text>
  <text x="52" y="80" font-family="'Inter','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif" font-size="14" font-weight="500" fill="#5E6B7A">An LLM turns any URL into a validated scraper config</text>
  <rect x="60" y="150" width="200" height="90" rx="14" fill="#E8F2FC" stroke="#CBE0F5" stroke-width="1.5"/><text x="160" y="195" font-family="'Inter','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif" font-size="16" font-weight="700" fill="#123E73" text-anchor="middle" dominant-baseline="middle">Paste job-</text><text x="160" y="214" font-family="'Inter','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif" font-size="16" font-weight="700" fill="#123E73" text-anchor="middle" dominant-baseline="middle">board URL</text><rect x="340" y="150" width="220" height="90" rx="14" fill="#2E73B8" stroke="#1F5FA6" stroke-width="1.5"/><text x="450" y="188" font-family="'Inter','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">LLM agent</text><text x="450" y="207" font-family="'Inter','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">(Claude / GPT)</text><text x="450" y="226" font-family="'Inter','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif" font-size="12" font-weight="500" fill="#DCEBFA" text-anchor="middle" dominant-baseline="middle">drives a live browser</text><rect x="640" y="150" width="200" height="90" rx="14" fill="#FFFFFF" stroke="#CBE0F5" stroke-width="1.5"/><text x="740" y="195" font-family="'Inter','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif" font-size="16" font-weight="700" fill="#123E73" text-anchor="middle" dominant-baseline="middle">Snapshot</text><text x="740" y="214" font-family="'Inter','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif" font-size="16" font-weight="700" fill="#123E73" text-anchor="middle" dominant-baseline="middle">DOM</text><rect x="640" y="320" width="200" height="90" rx="14" fill="#FFFFFF" stroke="#CBE0F5" stroke-width="1.5"/><text x="740" y="365" font-family="'Inter','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif" font-size="16" font-weight="700" fill="#123E73" text-anchor="middle" dominant-baseline="middle">Infer listing +</text><text x="740" y="384" font-family="'Inter','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif" font-size="16" font-weight="700" fill="#123E73" text-anchor="middle" dominant-baseline="middle">pagination</text><rect x="340" y="320" width="220" height="90" rx="14" fill="#FFFFFF" stroke="#CBE0F5" stroke-width="1.5"/><text x="450" y="358" font-family="'Inter','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif" font-size="16" font-weight="700" fill="#123E73" text-anchor="middle" dominant-baseline="middle">Validate</text><text x="450" y="377" font-family="'Inter','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif" font-size="16" font-weight="700" fill="#123E73" text-anchor="middle" dominant-baseline="middle">against live</text><text x="450" y="396" font-family="'Inter','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif" font-size="12" font-weight="500" fill="#5E6B7A" text-anchor="middle" dominant-baseline="middle">retry if invalid</text><rect x="60" y="320" width="200" height="100" rx="14" fill="#123E73" stroke="#123E73" stroke-width="1.5"/><text x="160" y="363" font-family="'Inter','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">SourceConfig</text><text x="160" y="382" font-family="'Inter','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">✓ ready</text><text x="160" y="401" font-family="'Inter','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif" font-size="12" font-weight="500" fill="#B9CEE8" text-anchor="middle" dominant-baseline="middle">opens in editor</text><line x1="260" y1="195" x2="335" y2="195" stroke="#2E73B8" stroke-width="2.5"  marker-end="url(#ah)"/><line x1="560" y1="195" x2="635" y2="195" stroke="#2E73B8" stroke-width="2.5"  marker-end="url(#ah)"/><line x1="740" y1="240" x2="740" y2="315" stroke="#2E73B8" stroke-width="2.5"  marker-end="url(#ah)"/><line x1="640" y1="365" x2="565" y2="365" stroke="#2E73B8" stroke-width="2.5"  marker-end="url(#ah)"/><line x1="340" y1="365" x2="265" y2="365" stroke="#2E73B8" stroke-width="2.5"  marker-end="url(#ah)"/><path d="M450 320 C 450 280, 450 250, 450 245" fill="none" stroke="#5B9BD5" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#ah)"/><text x="490" y="285" font-family="'Inter','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif" font-size="12" font-weight="600" fill="#5E6B7A" text-anchor="start" dominant-baseline="middle">iterate</text><text x="520" y="500" font-family="'Inter','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif" font-size="14" font-weight="500" fill="#5E6B7A" text-anchor="middle" dominant-baseline="middle">Human reviews, tweaks, and accepts the generated source</text>
</svg>
