<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 650" width="1040" height="650" role="img" aria-label="Credential security">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2E73B8"/>
    </marker>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5B9BD5"/><stop offset="1" stop-color="#9AC6EC"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F3F9FF"/>
    </linearGradient>
  </defs>
  <rect width="1040" height="650" rx="20" fill="url(#bg)"/>
  <rect x="1" y="1" width="1038" height="648" rx="19" fill="none" stroke="#CBE0F5" stroke-width="2"/>
  <rect x="34" y="40" width="6" height="30" rx="3" fill="#2E73B8"/>
  <text x="52" y="56" font-family="'Inter','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif" font-size="24" font-weight="800" fill="#123E73">Credential security</text>
  <text x="52" y="80" font-family="'Inter','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif" font-size="14" font-weight="500" fill="#5E6B7A">PBKDF2 + Fernet — the master password is never stored</text>
  <rect x="60" y="270" width="200" height="100" rx="14" fill="#E8F2FC" stroke="#CBE0F5" stroke-width="1.5"/><text x="160" y="313" font-family="'Inter','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif" font-size="16" font-weight="700" fill="#123E73" text-anchor="middle" dominant-baseline="middle">Master</text><text x="160" y="332" font-family="'Inter','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif" font-size="16" font-weight="700" fill="#123E73" text-anchor="middle" dominant-baseline="middle">password</text><text x="160" y="351" font-family="'Inter','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif" font-size="12" font-weight="500" fill="#5E6B7A" text-anchor="middle" dominant-baseline="middle">entered per session</text><rect x="330" y="270" width="200" height="100" rx="14" fill="#FFFFFF" stroke="#CBE0F5" stroke-width="1.5"/><text x="430" y="320" font-family="'Inter','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif" font-size="16" font-weight="700" fill="#123E73" text-anchor="middle" dominant-baseline="middle">PBKDF2</text><text x="430" y="339" font-family="'Inter','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif" font-size="16" font-weight="700" fill="#123E73" text-anchor="middle" dominant-baseline="middle">key derivation</text><rect x="600" y="270" width="200" height="100" rx="14" fill="#2E73B8" stroke="#1F5FA6" stroke-width="1.5"/><text x="700" y="320" font-family="'Inter','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">Fernet</text><text x="700" y="339" font-family="'Inter','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">encryption</text><rect x="600" y="440" width="200" height="90" rx="14" fill="#123E73" stroke="#123E73" stroke-width="1.5"/><text x="700" y="478" font-family="'Inter','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">Credentials</text><text x="700" y="497" font-family="'Inter','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">at rest</text><text x="700" y="516" font-family="'Inter','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif" font-size="12" font-weight="500" fill="#B9CEE8" text-anchor="middle" dominant-baseline="middle">ciphertext only</text><line x1="260" y1="320" x2="325" y2="320" stroke="#2E73B8" stroke-width="2.5"  marker-end="url(#ah)"/><line x1="530" y1="320" x2="595" y2="320" stroke="#2E73B8" stroke-width="2.5"  marker-end="url(#ah)"/><line x1="700" y1="370" x2="700" y2="435" stroke="#2E73B8" stroke-width="2.5"  marker-end="url(#ah)"/><rect x="840" y="270" width="150" height="100" rx="14" fill="none" stroke="#CBE0F5" stroke-width="1.5" stroke-dasharray="6 5"/><text x="915" y="305" font-family="'Inter','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif" font-size="13" font-weight="700" fill="#5E6B7A" text-anchor="middle" dominant-baseline="middle">Master pw</text><text x="915" y="328" font-family="'Inter','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif" font-size="13" font-weight="700" fill="#5E6B7A" text-anchor="middle" dominant-baseline="middle">never</text><text x="915" y="348" font-family="'Inter','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif" font-size="13" font-weight="700" fill="#5E6B7A" text-anchor="middle" dominant-baseline="middle">persisted</text>
</svg>
