<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 650" width="1040" height="650" role="img" aria-label="Reusable browser agents">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2E73B8"/>
    </marker>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5B9BD5"/><stop offset="1" stop-color="#9AC6EC"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F3F9FF"/>
    </linearGradient>
  </defs>
  <rect width="1040" height="650" rx="20" fill="url(#bg)"/>
  <rect x="1" y="1" width="1038" height="648" rx="19" fill="none" stroke="#CBE0F5" stroke-width="2"/>
  <rect x="34" y="40" width="6" height="30" rx="3" fill="#2E73B8"/>
  <text x="52" y="56" font-family="'Inter','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif" font-size="24" font-weight="800" fill="#123E73">Reusable browser agents</text>
  <text x="52" y="80" font-family="'Inter','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif" font-size="14" font-weight="500" fill="#5E6B7A">Composable as steps inside any flow</text>
  <rect x="70" y="170" width="200" height="110" rx="14" fill="#FFFFFF" stroke="#CBE0F5" stroke-width="1.5"/><text x="170" y="218" font-family="'Inter','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif" font-size="16" font-weight="700" fill="#123E73" text-anchor="middle" dominant-baseline="middle">Register</text><text x="170" y="238" font-family="'Inter','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif" font-size="12" font-weight="500" fill="#5E6B7A" text-anchor="middle" dominant-baseline="middle">agent 1</text><rect x="300" y="170" width="200" height="110" rx="14" fill="#FFFFFF" stroke="#CBE0F5" stroke-width="1.5"/><text x="400" y="218" font-family="'Inter','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif" font-size="16" font-weight="700" fill="#123E73" text-anchor="middle" dominant-baseline="middle">Login</text><text x="400" y="238" font-family="'Inter','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif" font-size="12" font-weight="500" fill="#5E6B7A" text-anchor="middle" dominant-baseline="middle">agent 2</text><rect x="530" y="170" width="200" height="110" rx="14" fill="#FFFFFF" stroke="#CBE0F5" stroke-width="1.5"/><text x="630" y="218" font-family="'Inter','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif" font-size="16" font-weight="700" fill="#123E73" text-anchor="middle" dominant-baseline="middle">Confirm email</text><text x="630" y="238" font-family="'Inter','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif" font-size="12" font-weight="500" fill="#5E6B7A" text-anchor="middle" dominant-baseline="middle">agent 3</text><rect x="760" y="170" width="200" height="110" rx="14" fill="#FFFFFF" stroke="#CBE0F5" stroke-width="1.5"/><text x="860" y="218" font-family="'Inter','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif" font-size="16" font-weight="700" fill="#123E73" text-anchor="middle" dominant-baseline="middle">Search threads</text><text x="860" y="238" font-family="'Inter','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif" font-size="12" font-weight="500" fill="#5E6B7A" text-anchor="middle" dominant-baseline="middle">agent 4</text><rect x="70" y="320" width="200" height="110" rx="14" fill="#FFFFFF" stroke="#CBE0F5" stroke-width="1.5"/><text x="170" y="368" font-family="'Inter','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif" font-size="16" font-weight="700" fill="#123E73" text-anchor="middle" dominant-baseline="middle">Post reply</text><text x="170" y="388" font-family="'Inter','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif" font-size="12" font-weight="500" fill="#5E6B7A" text-anchor="middle" dominant-baseline="middle">agent 5</text><rect x="300" y="320" width="200" height="110" rx="14" fill="#FFFFFF" stroke="#CBE0F5" stroke-width="1.5"/><text x="400" y="368" font-family="'Inter','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif" font-size="16" font-weight="700" fill="#123E73" text-anchor="middle" dominant-baseline="middle">Create thread</text><text x="400" y="388" font-family="'Inter','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif" font-size="12" font-weight="500" fill="#5E6B7A" text-anchor="middle" dominant-baseline="middle">agent 6</text><rect x="530" y="320" width="200" height="110" rx="14" fill="#2E73B8" stroke="#1F5FA6" stroke-width="1.5"/><text x="630" y="368" font-family="'Inter','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">Generate comment</text><text x="630" y="388" font-family="'Inter','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif" font-size="12" font-weight="500" fill="#DCEBFA" text-anchor="middle" dominant-baseline="middle">agent 7</text><text x="520" y="590" font-family="'Inter','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif" font-size="14" font-weight="500" fill="#5E6B7A" text-anchor="middle" dominant-baseline="middle">Each agent shares the running browser session</text>
</svg>
